[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cano-ugc-commerce-studio"
version = "0.5.0"
description = "Evidence-aware affiliate UGC commerce intelligence and Higgsfield production engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "jsonschema>=4.22,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
ugc-commerce = "ugc_commerce.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
