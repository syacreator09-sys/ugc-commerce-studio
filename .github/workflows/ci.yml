name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Compile
        run: python -m compileall -q src scripts

      - name: Test
        run: pytest -q

      - name: Intelligence CLI smoke
        run: |
          python -m ugc_commerce.cli discover --source tiktok_invitation --input examples/tiktok-invitation-sparse.json > /tmp/discovery.json
          python -m ugc_commerce.cli economics --product examples/product-intelligence-input.json --views 1000 --ctr 0.02 --cvr 0.05 > /tmp/economics.json
          python -m ugc_commerce.cli scout --product examples/product-intelligence-input.json > /tmp/scout.json
          python -m ugc_commerce.cli performance --input examples/performance.json > /tmp/performance.json
          python -m ugc_commerce.cli history-add --input examples/performance.json --history /tmp/performance-history.jsonl > /tmp/history-add.json
          python -m ugc_commerce.cli baselines --history /tmp/performance-history.jsonl --dimension channel > /tmp/baselines.json
          python -m ugc_commerce.cli factory-order \
            --product examples/product-intelligence-input.json \
            --economics examples/factory-production-economics.json \
            --channel cano \
            --angle transformation \
            --angle problem_solution \
            --angle demo \
            --creative-count 3 \
            --output /tmp/factory-order.json > /tmp/factory-order-summary.json
          python -m ugc_commerce.cli factory-order-approve \
            --order /tmp/factory-order.json \
            --approved-by Cano \
            --output /tmp/factory-order-approved.json > /tmp/factory-approval-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          discovery = json.loads(Path('/tmp/discovery.json').read_text())
          economics = json.loads(Path('/tmp/economics.json').read_text())
          scout = json.loads(Path('/tmp/scout.json').read_text())
          performance = json.loads(Path('/tmp/performance.json').read_text())
          baselines = json.loads(Path('/tmp/baselines.json').read_text())
          order = json.loads(Path('/tmp/factory-order.json').read_text())
          approved = json.loads(Path('/tmp/factory-order-approved.json').read_text())
          assert discovery[0]['displayed_earnings_currency']['status'] == 'UNKNOWN'
          assert economics['organic_commission_per_sale'] == 181.9
          assert economics['shop_ads_commission_per_sale'] == 8.99
          assert economics['scenarios'][0]['expected_orders_per_1000_views'] == 1.0
          assert scout['production_decision'] == 'PROCEDE'
          assert scout['sample_decision'] == 'SOLICITAR'
          assert performance['commission_per_1000_views'] == 363.8
          assert baselines['records'] == 1
          assert baselines['baselines'][0]['key'] == 'cano'
          assert order['status'] == 'READY_FOR_APPROVAL'
          assert order['economics']['base_net_benefit'] == 609.5
          assert order['economics']['recommendation'] == 'APPROVAL_REQUIRED'
          assert approved['status'] == 'APPROVED'
          assert approved['scope_id'] == order['scope_id']
          assert approved['order_id'] == order['order_id']
          PY

      - name: Doctor
        run: python scripts/doctor.py --config config/user-config.example.json
